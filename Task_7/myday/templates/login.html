{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>Login - Online Testing System</title>

    <link rel="stylesheet"
          href="{% static 'mycss.css' %}">

</head>


<body>

<div class="page">


    <h1>
        Online Testing System
    </h1>


    <div class="auth-card">

        <h2>
            Login
        </h2>

        <p>
            Login to access your tests.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="bottom-text">

            Don't have an account?

            <a href="{% url 'myday:signup' %}">
                Sign Up
            </a>

        </p>


        <a href="{% url 'myday:home' %}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
