{% load static %}

<!DOCTYPE html>

<html>

<head>

    <title>Test Result</title>

    <link rel="stylesheet"
          href="{% static 'mycss.css' %}">

</head>


<body>


<div class="page">


    <h1>
        Online Testing System
    </h1>


    <div class="result-card">

        <div class="result-icon">
            ✓
        </div>


        <h2>
            Test {{ test_number }} Completed
        </h2>


        <div class="score">

            {{ points }}

            <span>
                / 10
            </span>

        </div>


        <div class="result-details">

            <div>
                <strong>
                    Total Questions
                </strong>

                <span>
                    {{ total }}
                </span>
            </div>


            <div>
                <strong>
                    Right Answers
                </strong>

                <span>
                    {{ right }}
                </span>
            </div>


            <div>
                <strong>
                    Wrong Answers
                </strong>

                <span>
                    {{ wrong }}
                </span>
            </div>

        </div>


        <div class="result-buttons">

            <a href="{% url 'myday:home' %}">
                Home
            </a>

            <a href="{% url 'myday:test_history' %}">
                Test History
            </a>

        </div>

    </div>


</div>


</body>

</html>
