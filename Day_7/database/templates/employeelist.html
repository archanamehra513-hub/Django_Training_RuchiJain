<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Employee List</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
       <div> 
        <h1>Employee List</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Employee NO</th>
                <th>Employee Name</th>
                <th>Employee Salary</th>
            </tr>
            {% for i in Employees %}
            <tr>
                <td><a href="http://localhost:8000/database/updateEmployeeform/?id={{i.id}}">{{i.id}}</a></td>
                <td>{{i.eno}}</td>
                <td>{{i.ename}}</td>
                <td>{{i.esal}}</td>
                <td><a href="http://localhost:8000/database/deleteEmployee/?id={{i.id}}">delete</a></td>
                
            </tr>
            {% endfor %}
        </table>
       </div>
    </body>
</html>
