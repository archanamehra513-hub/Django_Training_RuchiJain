<html>

        <link rel="stylesheet" href="">

    <body>
     <form action="{% url 'updateEmployee'%}" method="post">
         {% csrf_token %}
         <input type="hidden" name="id" value={{employee.id}}></input>
         <div>
            <label for="eno">Employee Number</label>
         </div>
         <div>
            <input type="number" name="eno" id="eno" value="{{employee.eno}}">
         </div>
         <div>
            <label for="ename">Employee Name</label>
         </div>
         <div>
            <input type="text" name="ename" id="ename" value="{{employee.ename}}">
         </div>
         <div>
            <label for="eno">Employee Salary</label>
         </div>
         <div>
            <input type="number" name="esal" id="esal" value="{{employee.esal}}">
         </div>
         <div>
            <input type="submit" value="Update">
         </div>
     </form>
    </body>
</html>
