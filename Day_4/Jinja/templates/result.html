<!DOCTYPE html>
<html>
<head>
    <title>Info</title>
</head>

<body>

    <div>
         RESULT
    </div>

    <div>
        <h1>result of {{ name }}</h1>
    </div>
    <div>
        {% if marks >= 80 %}
        <h2>your Grade is A</h2>
        {% elif marks >= 70 %}
        <h2>your Grade is B</h2>
        {% elif marks >= 60 %}
        <h2>your Grade is C</h2>
        {% elif marks >= 50 %}
        <h2>your Grade is D</h2>
        {% else %}
        <h2>your fail</h2>
        {% endif %}
    </div>

</body>
</html>
