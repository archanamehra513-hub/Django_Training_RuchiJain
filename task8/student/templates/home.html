<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

</head>

<body style="
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
">

    <div style="
        width: 500px;
        margin: 100px auto;
        padding: 40px;
        background-color: white;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    ">

        <h1 style="
            color: #1f2937;
            margin-bottom: 35px;
        ">
            Welcome to Student Dashboard
        </h1>

        <div style="
            margin-bottom: 20px;
        ">

            <a href="{% url 'signup' %}" style="
                display: inline-block;
                width: 200px;
                padding: 12px;
                background-color: #2563eb;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 16px;
            ">
                Sign-Up
            </a>

        </div>

        <div>

            <a href="{% url 'login' %}" style="
                display: inline-block;
                width: 200px;
                padding: 12px;
                background-color: #16a34a;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 16px;
            ">
                Login
            </a>

        </div>

    </div>

</body>

</html>
